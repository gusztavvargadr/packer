parameters:
  sample: ''
  image: ''
  provider: ''
  hostArchitecture: ''
  publish: true

stages:
  - stage: native
    displayName: Native

    jobs:
      - template: ./jobs.yml
        parameters:
          sample: ${{ parameters.sample }}
          image: ${{ parameters.image }}
          provider: ${{ parameters.provider }}
          hostArchitecture: ${{ parameters.hostArchitecture }}
          build: native
          publish: ${{ parameters.publish }}

  - stage: vagrant
    displayName: Vagrant

    jobs:
      - template: ./jobs.yml
        parameters:
          sample: ${{ parameters.sample }}
          image: ${{ parameters.image }}
          provider: ${{ parameters.provider }}
          hostArchitecture: ${{ parameters.hostArchitecture }}
          build: vagrant
          publish: ${{ parameters.publish }}
