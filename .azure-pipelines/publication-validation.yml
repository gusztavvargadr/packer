# Temporary acceptance flow for the Hyper-V proof in #579.
trigger: none
pr: none

parameters:
  - name: provider
    displayName: Provider
    type: string
    default: qemu
    values:
      - qemu
      - hyperv

stages:
  - template: ./stages.yml
    parameters:
      sample: windows-server
      image: 2025-standard-core
      provider: ${{ parameters.provider }}
      publishToVagrantCloud: false

  - stage: publication
    displayName: Publication
    dependsOn: vagrant

    jobs:
      - job: publish
        displayName: Publish internal windows-server/2025-standard-core/${{ parameters.provider }}/vagrant

        pool:
          name: default
          demands:
            - VSTS_AGENT_CAP_PACKER -equals publish

        workspace:
          clean: all

        variables:
          artifactPath: $(Build.SourcesDirectory)/artifacts/windows-server/2025-standard-core/${{ parameters.provider }}/vagrant
          candidatePath: $(Build.ArtifactStagingDirectory)/publication-candidate

        steps:
          - checkout: self
            submodules: recursive

          - script: |
              dotnet --info

              dotnet tool restore
            displayName: Initialize .NET

          - script: |
              packer --version
            displayName: Initialize Packer

          - script: |
              dotnet cake --configuration windows-server/2025-standard-core/${{ parameters.provider }}/vagrant --target init
            displayName: Init

          - task: DownloadPipelineArtifact@2
            inputs:
              source: current
              artifact: vagrant-build
              targetPath: $(artifactPath)/image
            displayName: Download canonical image

          - script: |
              dotnet cake --configuration windows-server/2025-standard-core/${{ parameters.provider }}/vagrant --target restore
            displayName: Restore publication candidate

          - task: CopyFiles@2
            inputs:
              SourceFolder: $(artifactPath)
              Contents: |
                vagrant/vagrant.box
                checksum.sha256
              TargetFolder: $(candidatePath)
              flattenFolders: true
            displayName: Stage publication candidate

          - publish: $(candidatePath)
            artifact: publication-candidate
            displayName: Publish publication candidate

          - script: |
              dotnet cake --configuration windows-server/2025-standard-core/${{ parameters.provider }}/vagrant --target clean
            displayName: Clean
            condition: always()

  - stage: acceptance
    displayName: Acceptance
    dependsOn: publication

    jobs:
      - job: download
        displayName: Download internal windows-server/2025-standard-core/${{ parameters.provider }}/vagrant

        pool:
          name: default
          demands:
            - VSTS_AGENT_CAP_PACKER -equals build
            - VSTS_AGENT_CAP_VIRTUALIZATION_PROVIDER -equals ${{ parameters.provider }}

        workspace:
          clean: all

        variables:
          artifactPath: $(Build.SourcesDirectory)/artifacts/windows-server/2025-standard-core/${{ parameters.provider }}/vagrant

        steps:
          - checkout: self
            submodules: recursive

          - script: |
              dotnet --info

              dotnet tool restore
            displayName: Initialize .NET

          - script: |
              packer --version
            displayName: Initialize Packer

          - script: |
              vagrant --version
              vagrant plugin list

              vagrant box list
              vagrant global-status --prune
            displayName: Initialize Vagrant

          - script: |
              dotnet cake --configuration windows-server/2025-standard-core/${{ parameters.provider }}/vagrant --target init
            displayName: Init

          - script: |
              dotnet cake --configuration windows-server/2025-standard-core/${{ parameters.provider }}/vagrant --target restore-configuration
            displayName: Restore configuration

          - task: DownloadPipelineArtifact@2
            inputs:
              source: current
              artifact: publication-candidate
              targetPath: $(artifactPath)/vagrant
            displayName: Download publication candidate

          - script: |
              ruby -rdigest -e "expected = File.read(ARGV.fetch(1)).split.first; actual = Digest::SHA256.file(ARGV.fetch(0)).hexdigest; raise 'checksum mismatch: expected ' + expected + ', got ' + actual unless actual == expected; puts 'publication candidate sha256: ' + actual" "$(artifactPath)/vagrant/vagrant.box" "$(artifactPath)/vagrant/checksum.sha256"
            displayName: Verify publication candidate

          - script: |
              dotnet cake --configuration windows-server/2025-standard-core/${{ parameters.provider }}/vagrant --target test
            displayName: Test publication candidate

          - script: |
              dotnet cake --configuration windows-server/2025-standard-core/${{ parameters.provider }}/vagrant --target clean
            displayName: Clean
            condition: always()
