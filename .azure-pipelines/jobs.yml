parameters:
  sample: ''
  image: ''
  provider: ''
  hostArchitecture: ''
  artifactHandoff: conventional
  vagrantCanonicalization: none
  build: ''

jobs:
  - job: build
    displayName: Build ${{ parameters.sample }}/${{ parameters.image }}/${{ parameters.provider }}/${{ parameters.build }}

    pool:
      name: default
      demands:
        - VSTS_AGENT_CAP_PACKER -equals build
        - VSTS_AGENT_CAP_VIRTUALIZATION_PROVIDER -equals ${{ parameters.provider }}
        - ${{ if ne(parameters.hostArchitecture, '') }}:
          - Agent.OS -equals Darwin
          - Agent.OSArchitecture -equals ${{ parameters.hostArchitecture }}

    workspace:
      clean: all

    timeoutInMinutes: 150

    variables:
      sourcePipelineArtifactsPath: $[ replace(variables['resources.pipeline.source.pipelineName'], '.', '/') ]
      artifactPath: $(Build.SourcesDirectory)/artifacts/${{ parameters.sample }}/${{ parameters.image }}/${{ parameters.provider }}/${{ parameters.build }}
      artifactTransferPath: $(Pipeline.Workspace)/artifact-transfer-payload/${{ parameters.build }}

    steps:
      - checkout: self
        submodules: recursive

      - ${{ if and(eq(parameters.build, 'vagrant'), eq(parameters.artifactHandoff, 'vagrant-raw-tar')) }}:
        - script: |
            go version
            go test ./...
          workingDirectory: ./src/artifact-transfer
          displayName: Initialize artifact transfer

      - ${{ if and(eq(parameters.build, 'native'), eq(parameters.artifactHandoff, 'virtualbox-native-sparse')) }}:
        - script: |
            ruby --version
            ruby -c src/artifact-transfer/virtualbox_native.rb
          displayName: Initialize VirtualBox native artifact transfer

      - script: |
          dotnet --info

          dotnet tool restore
        displayName: Initialize .NET

      - script: |
          packer --version
        displayName: Initialize Packer

      - script: |
          vagrant --version
          vagrant plugin list

          vagrant box list
          vagrant global-status --prune
        displayName: Initialize Vagrant

      - script: |
          dotnet cake --configuration ${{ parameters.sample }}/${{ parameters.image }}/${{ parameters.provider }}/${{ parameters.build }} --target init --reportHostAndProvider ${{ eq(parameters.hostArchitecture, 'ARM64') }}
        displayName: Init

      - ${{ if and(eq(parameters.build, 'native'), eq(parameters.artifactHandoff, 'virtualbox-native-sparse')) }}:
        - script: |
            ruby src/artifact-transfer/virtualbox_native.rb fixture-virtualbox-native
          displayName: Test VirtualBox native lifecycle

      - script: |
          dotnet cake --configuration ${{ parameters.sample }}/${{ parameters.image }}/${{ parameters.provider }}/${{ parameters.build }} --target restore
        displayName: Restore

      - ${{ if eq(parameters.build, 'native') }}:
        - task: DownloadPipelineArtifact@2
          inputs:
            source: specific
            artifact: native-build
            targetPath: ./artifacts/$(sourcePipelineArtifactsPath)/native
            project: $(System.TeamProjectId)
            pipeline: $(resources.pipeline.source.pipelineID)
            runVersion: latestFromBranch
            runBranch: $(Build.SourceBranch)
          displayName: Download artifacts
          condition: and(succeeded(), ne(variables['resources.pipeline.source.pipelineID'], ''))

      - ${{ if eq(parameters.build, 'vagrant') }}:
        - task: DownloadPipelineArtifact@2
          inputs:
            source: current
            artifact: native-build
            targetPath: ./artifacts/${{ parameters.sample }}/${{ parameters.image }}/${{ parameters.provider }}/native
          displayName: Download artifacts

      - script: |
          dotnet cake --configuration ${{ parameters.sample }}/${{ parameters.image }}/${{ parameters.provider }}/${{ parameters.build }} --target build
        displayName: Build
        env:
          ${{ if and(eq(parameters.build, 'native'), eq(parameters.artifactHandoff, 'virtualbox-native-sparse')) }}:
            PKR_VAR_virtualbox_native_handoff: true

      - ${{ if and(eq(parameters.build, 'vagrant'), eq(parameters.vagrantCanonicalization, 'hyperv')) }}:
        - script: |
            go run . canonicalize-hyperv-vagrant "$(artifactPath)"
          workingDirectory: ./src/artifact-transfer
          displayName: Canonicalize Hyper-V Vagrant box

      - ${{ if and(eq(parameters.build, 'native'), eq(parameters.artifactHandoff, 'virtualbox-native-sparse')) }}:
        - script: |
            ruby src/artifact-transfer/virtualbox_native.rb prepare-virtualbox-native "$(artifactPath)"
          displayName: Produce canonical VirtualBox native image

      - script: |
          dotnet cake --configuration ${{ parameters.sample }}/${{ parameters.image }}/${{ parameters.provider }}/${{ parameters.build }} --target test
        displayName: Test

      - ${{ if and(eq(parameters.build, 'vagrant'), eq(parameters.artifactHandoff, 'vagrant-raw-tar')) }}:
        - script: |
            go run . prepare-vagrant "$(artifactPath)" "$(artifactTransferPath)"
          workingDirectory: ./src/artifact-transfer
          displayName: Prepare Vagrant artifact handoff

        - publish: $(artifactTransferPath)
          artifact: vagrant-transfer
          displayName: Publish Vagrant transfer
      - ${{ else }}:
        - publish: $(artifactPath)
          artifact: ${{ parameters.build }}-build
          displayName: Publish artifacts

      - script: |
          dotnet cake --configuration ${{ parameters.sample }}/${{ parameters.image }}/${{ parameters.provider }}/${{ parameters.build }} --target clean
        displayName: Clean
        condition: always()

  - ${{ if and(eq(parameters.build, 'native'), eq(parameters.artifactHandoff, 'virtualbox-native-sparse')) }}:
    - job: verify
      displayName: Verify clean-job handoff ${{ parameters.sample }}/${{ parameters.image }}/${{ parameters.provider }}/${{ parameters.build }}
      dependsOn: build

      pool:
        name: default
        demands:
          - VSTS_AGENT_CAP_PACKER -equals build
          - VSTS_AGENT_CAP_VIRTUALIZATION_PROVIDER -equals ${{ parameters.provider }}

      workspace:
        clean: all

      variables:
        artifactPath: $(Build.SourcesDirectory)/artifacts/${{ parameters.sample }}/${{ parameters.image }}/${{ parameters.provider }}/${{ parameters.build }}

      steps:
        - checkout: self
          submodules: recursive

        - task: DownloadPipelineArtifact@2
          inputs:
            source: current
            artifact: native-build
            targetPath: $(artifactPath)
          displayName: Download VirtualBox native image

        - script: |
            ruby src/artifact-transfer/virtualbox_native.rb verify-virtualbox-native "$(artifactPath)"
          displayName: Verify VirtualBox native image

  - ${{ if eq(parameters.build, 'vagrant') }}:
    - job: publish
      displayName: Hand off and publish ${{ parameters.sample }}/${{ parameters.image }}/${{ parameters.provider }}/${{ parameters.build }}
      dependsOn: build
      ${{ if eq(parameters.artifactHandoff, 'vagrant-raw-tar') }}:
        condition: succeeded()
      ${{ else }}:
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))

      pool:
        name: default
        demands:
          - VSTS_AGENT_CAP_PACKER -equals publish

      workspace:
        clean: all

      variables:
        - group: environment-vagrant-cloud
        - group: environment-hcp-vagrant
        - name: artifactPath
          value: $(Build.SourcesDirectory)/artifacts/${{ parameters.sample }}/${{ parameters.image }}/${{ parameters.provider }}/${{ parameters.build }}
        - name: artifactTransferPath
          value: $(Pipeline.Workspace)/artifact-transfer-payload/${{ parameters.build }}

      steps:
        - checkout: self
          submodules: recursive

        - ${{ if eq(parameters.artifactHandoff, 'vagrant-raw-tar') }}:
          - script: |
              go version
              go test ./...
            workingDirectory: ./src/artifact-transfer
            displayName: Initialize artifact transfer

        - script: |
            dotnet --info

            dotnet tool restore
          displayName: Initialize .NET

        - script: |
            packer --version
          displayName: Initialize Packer
          condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))

        - script: |
            dotnet cake --configuration ${{ parameters.sample }}/${{ parameters.image }}/${{ parameters.provider }}/${{ parameters.build }} --target init
          displayName: Init
          condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))

        - ${{ if eq(parameters.artifactHandoff, 'vagrant-raw-tar') }}:
          - task: DownloadPipelineArtifact@2
            inputs:
              source: current
              artifact: vagrant-transfer
              targetPath: $(artifactTransferPath)
            displayName: Download Vagrant transfer

          - script: |
              go run . reconstruct-vagrant "$(artifactTransferPath)" "$(artifactPath)"
            workingDirectory: ./src/artifact-transfer
            displayName: Reconstruct Vagrant artifact

          - script: |
              go run . verify-vagrant "$(artifactTransferPath)" "$(artifactPath)"
            workingDirectory: ./src/artifact-transfer
            displayName: Verify Vagrant artifact
        - ${{ else }}:
          - task: DownloadPipelineArtifact@2
            inputs:
              source: current
              artifact: vagrant-build
              targetPath: $(artifactPath)
            displayName: Download artifacts

        - script: |
            dotnet cake --configuration ${{ parameters.sample }}/${{ parameters.image }}/${{ parameters.provider }}/${{ parameters.build }} --target publish
          displayName: Publish
          env:
            VAGRANT_CLOUD_TOKEN: $(vagrant-cloud-token)
            HCP_CLIENT_ID: $(hcp-client-id)
            HCP_CLIENT_SECRET: $(hcp-client-secret)
          condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))

        - script: |
            dotnet cake --configuration ${{ parameters.sample }}/${{ parameters.image }}/${{ parameters.provider }}/${{ parameters.build }} --target clean
          displayName: Clean
          condition: always()

    - job: download
      displayName: Download ${{ parameters.sample }}/${{ parameters.image }}/${{ parameters.provider }}/${{ parameters.build }}
      dependsOn: publish
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))

      pool:
        name: default
        demands:
          - VSTS_AGENT_CAP_PACKER -equals build
          - VSTS_AGENT_CAP_VIRTUALIZATION_PROVIDER -equals ${{ parameters.provider }}
          - ${{ if ne(parameters.hostArchitecture, '') }}:
            - Agent.OS -equals Darwin
            - Agent.OSArchitecture -equals ${{ parameters.hostArchitecture }}

      workspace:
        clean: all

      steps:
        - checkout: self
          submodules: recursive

        - script: |
            dotnet --info

            dotnet tool restore
          displayName: Initialize .NET

        - script: |
            packer --version
          displayName: Initialize Packer

        - script: |
            vagrant --version
            vagrant plugin list

            vagrant box list
            vagrant global-status --prune
          displayName: Initialize Vagrant

        - script: |
            dotnet cake --configuration ${{ parameters.sample }}/${{ parameters.image }}/${{ parameters.provider }}/${{ parameters.build }} --target init --reportHostAndProvider ${{ eq(parameters.hostArchitecture, 'ARM64') }}
          displayName: Init

        - script: |
            dotnet cake --configuration ${{ parameters.sample }}/${{ parameters.image }}/${{ parameters.provider }}/${{ parameters.build }} --target download
          displayName: Download

        - script: |
            dotnet cake --configuration ${{ parameters.sample }}/${{ parameters.image }}/${{ parameters.provider }}/${{ parameters.build }} --target clean
          displayName: Clean
          condition: always()
