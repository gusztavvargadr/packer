trigger: none
pr: none

jobs:
  - job: validate
    displayName: Validate artifact transfer $(hostedImage)

    strategy:
      matrix:
        windows:
          hostedImage: windows-2025
        linux:
          hostedImage: ubuntu-22.04

    pool:
      vmImage: $(hostedImage)

    workspace:
      clean: all

    steps:
      - checkout: self
        submodules: recursive

      - powershell: |
          $micromambaDirectory = Join-Path $env:AGENT_TEMPDIRECTORY "micromamba"
          $micromambaArchive = Join-Path $micromambaDirectory "micromamba.tar.bz2"
          $micromamba = Join-Path $micromambaDirectory "Library\bin\micromamba.exe"
          $pigzPrefix = Join-Path $env:AGENT_TOOLSDIRECTORY "pigz\2.8\x64"
          $pigzDirectory = Join-Path $pigzPrefix "Library\bin"

          New-Item -ItemType Directory -Path $micromambaDirectory -Force | Out-Null
          Invoke-WebRequest -Uri "https://micro.mamba.pm/api/micromamba/win-64/latest" -OutFile $micromambaArchive
          tar.exe -xf $micromambaArchive -C $micromambaDirectory
          if ($LASTEXITCODE -ne 0) {
            throw "micromamba extraction failed with code $LASTEXITCODE."
          }

          $env:MAMBA_ROOT_PREFIX = Join-Path $micromambaDirectory "root"
          $env:CONDA_OVERRIDE_CUDA = "0"
          & $micromamba create --yes --prefix $pigzPrefix --channel conda-forge "pigz=2.8"
          if ($LASTEXITCODE -ne 0) {
            throw "pigz installation failed with code $LASTEXITCODE."
          }

          $pigz = Join-Path $pigzDirectory "pigz.exe"
          if (-not (Test-Path $pigz)) {
            throw "pigz installation did not produce $pigz."
          }

          $env:PATH = "$pigzDirectory;$env:PATH"
          Write-Host "##vso[task.prependpath]$pigzDirectory"
          pigz --version
        displayName: Install pigz with micromamba
        condition: eq(variables['Agent.OS'], 'Windows_NT')

      - bash: |
          if ! command -v bsdtar >/dev/null 2>&1 || ! command -v pigz >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes libarchive-tools pigz
          fi
        displayName: Install archive tools
        condition: eq(variables['Agent.OS'], 'Linux')

      - script: |
          dotnet --info
          dotnet tool restore
          dotnet cake src/artifact-transfer/build.cake
        displayName: Test artifact transfer

      - script: |
          ruby --version
          ruby -c src/artifact-transfer/vagrant_box.rb
          ruby -c src/artifact-transfer/vagrant_box_test.rb
          ruby -c src/artifact-transfer/virtualbox_native.rb
          ruby -e "require 'yaml'; Dir['.azure-pipelines/**/*.{yml,yaml}'].each { |file| YAML.load_file(file) }"
          packer fmt -check src
          git diff --check
          git diff --exit-code
        displayName: Validate artifact transfer
