trigger: none
pr: none

jobs:
  - job: validate
    displayName: Validate artifact transfer $(hostOS)/$(hostArchitecture)

    strategy:
      matrix:
        linux_amd64:
          hostOS: Linux
          hostArchitecture: X64
        windows_amd64:
          hostOS: Windows_NT
          hostArchitecture: X64
        macos_arm64:
          hostOS: Darwin
          hostArchitecture: ARM64
      maxParallel: 3

    pool:
      name: default
      demands:
        - VSTS_AGENT_CAP_PACKER -equals build
        - VSTS_AGENT_CAP_VIRTUALIZATION_PROVIDER -equals virtualbox
        - Agent.OS -equals $(hostOS)
        - Agent.OSArchitecture -equals $(hostArchitecture)

    workspace:
      clean: all

    timeoutInMinutes: 30

    steps:
      - checkout: self
        submodules: recursive

      - script: |
          dotnet --info
          dotnet tool restore
          ruby -e "require 'rbconfig'; command = RbConfig::CONFIG['host_os'] =~ /mswin|mingw|cygwin/i ? 'tar' : 'bsdtar'; exit(system(command, '--version') ? 0 : 1)"
          dotnet cake --target test-artifact-transfer
        displayName: Test artifact transfer

      - script: |
          ruby --version
          ruby -c src/artifact-transfer/vagrant_box.rb
          ruby -c src/artifact-transfer/vagrant_box_test.rb
          ruby -c src/artifact-transfer/virtualbox_native.rb
          ruby -e "require 'yaml'; Dir['.azure-pipelines/**/*.{yml,yaml}'].each { |file| YAML.load_file(file) }"
          packer fmt -check src
          git diff --check
          git diff --exit-code
        displayName: Validate artifact transfer
